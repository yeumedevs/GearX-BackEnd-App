version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: gearx_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gearx_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: gearx_redis
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  redis_data: